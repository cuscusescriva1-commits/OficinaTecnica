<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#123A5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oficina">
<meta name="description" content="Oficina técnica: un tycoon idle de ingeniería. Acepta encargos, contrata ingenieros y haz crecer tu oficina.">
<title>Oficina técnica</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--yellow:#F2B705;--navy:#123A5E;--blue:#2C6AA3;--bg:#EEF3F8;--card:#fff;--head:#DDE8F2;--ink:#12283A;--ink2:#51677A;--line:#12283A;--good:#1E8E52;--bad:#D63C3C;--navH:calc(62px + env(safe-area-inset-bottom));--sheetH:330px;--cond:"Barlow Semi Condensed",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0E2236;--card:#16304A;--head:#1F4165;--ink:#EAF1F8;--ink2:#A3B8CB;--line:#6E8AA6;--good:#4CD98A;--bad:#FF7A78}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#123A5E;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%;font-family:Barlow,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-size:15px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border-radius:0;margin:0}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num,.chip .vl,.cell b,.btn em{font-variant-numeric:tabular-nums}
#hud{position:fixed;left:0;right:0;top:0;z-index:5;color:#fff;background:rgba(18,58,94,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1.5px solid rgba(255,255,255,.16);padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 8px) 7px calc(env(safe-area-inset-left) + 8px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{position:relative;background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.2);padding:4px 9px 6px;min-height:54px;overflow:hidden;transition:transform .12s}
.chip .lb{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;opacity:.78;font-weight:600;line-height:1.3}
.chip .vl{display:block;font:700 20px/1.1 var(--cond);white-space:nowrap}
.chip .sb{display:block;font-size:11px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.chip .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.16)}
.chip .bar b{display:block;height:100%;width:0;background:var(--yellow)}
.chip.bump{transform:scale(1.06)}
.chip.glow{border-color:var(--yellow);animation:glow 1.1s ease-in-out infinite}
.chip.neg .vl{color:#FF8C8A}
@keyframes glow{50%{box-shadow:0 0 14px rgba(242,183,5,.75)}}
#strip{display:flex;gap:6px;margin-top:6px;overflow-x:auto;scrollbar-width:none;min-height:0}
#strip::-webkit-scrollbar{display:none}
#strip:empty{display:none}
.mini{flex:0 0 138px;text-align:left;color:#fff;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.22);padding:3px 7px 6px;min-height:46px;position:relative}
.mini b{display:block;font:700 12px/1.2 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini span{display:flex;justify-content:space-between;font-size:11px;opacity:.88}
.mini i{position:absolute;left:0;bottom:0;height:3px;background:var(--yellow)}
.mini.late{border-color:#FF6B69}.mini.late i{background:#FF6B69}.mini.late span:first-of-type{color:#FFB0AE}
body.pan .row2,body.pan #strip{display:none}
#fit{position:fixed;right:calc(env(safe-area-inset-right) + 10px);z-index:4;width:46px;height:46px;border:1.5px solid rgba(255,255,255,.35);background:rgba(18,58,94,.88);color:#fff;display:grid;place-items:center}
#fit svg{width:24px;height:24px}
#streak{position:fixed;left:50%;transform:translateX(-50%) scale(1);z-index:4;font:700 22px var(--cond);color:var(--yellow);text-shadow:0 2px 0 #123A5E,0 0 10px rgba(0,0,0,.4);pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#streak.on{opacity:1}
#goal{position:fixed;left:calc(env(safe-area-inset-left) + 8px);right:calc(env(safe-area-inset-right) + 8px);bottom:calc(var(--navH) + 7px);z-index:4;display:flex;gap:8px;align-items:center;background:rgba(18,58,94,.92);color:#fff;border:1.5px solid rgba(255,255,255,.3);padding:5px 6px 5px 10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body.pan #goal{display:none}
#goal .tx{flex:1;min-width:0}
#goal .t{font:700 14px/1.15 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goal .t small{font-weight:600;opacity:.7;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
#goal .pb{height:7px;background:rgba(255,255,255,.2);margin-top:4px;position:relative}
#goal .pb b{display:block;height:100%;background:var(--yellow);width:0}
#goal .pt{font-size:11px;opacity:.85;margin-top:2px}
#claim{min-height:44px;min-width:104px;border:1.5px solid #123A5E;background:rgba(255,255,255,.14);color:rgba(255,255,255,.55);font:700 15px var(--cond);padding:0 10px;border-color:rgba(255,255,255,.25)}
#claim.ready{background:var(--yellow);color:#123A5E;border-color:#fff;animation:pulse 1s ease-in-out infinite;box-shadow:0 0 14px rgba(242,183,5,.8)}
@keyframes pulse{50%{transform:scale(1.06)}}
#nav{position:fixed;left:0;right:0;bottom:0;height:var(--navH);z-index:7;display:grid;grid-template-columns:repeat(4,1fr);background:#0D2D49;border-top:1.5px solid rgba(255,255,255,.2);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#nav button{position:relative;border:0;background:none;color:rgba(255,255,255,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 12px var(--cond);letter-spacing:.03em;min-height:56px}
#nav button svg{width:27px;height:27px}
#nav button.act{color:var(--yellow);background:rgba(242,183,5,.12);box-shadow:inset 0 3px 0 var(--yellow)}
.badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:19px;height:19px;border-radius:10px;background:#E5484D;color:#fff;font:700 12px/19px var(--cond);text-align:center;padding:0 5px;border:1.5px solid #0D2D49}
.badge:empty{display:none}
#sheet{position:fixed;left:0;right:0;bottom:var(--navH);height:var(--sheetH);z-index:6;background:var(--bg);color:var(--ink);border-top:2.5px solid var(--yellow);display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
#sheet.open{transform:none;visibility:visible;transition:transform .22s ease}
#sheet.min{height:46px}
#sheet.min #sbody{display:none}
#shead{flex:0 0 44px;display:flex;align-items:center;padding:0 4px 0 12px;gap:2px;border-bottom:1.5px solid var(--line);background:var(--head)}
#shead h2{flex:1;margin:0;font:700 18px var(--cond);letter-spacing:.02em}
#shead button{width:44px;height:44px;border:0;background:none;display:grid;place-items:center}
#shead svg{width:22px;height:22px}
#sheet.min #shead{flex-basis:44px}
#sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:10px;touch-action:pan-y}
.sec{margin:12px 12px 2px;font:700 13px var(--cond);text-transform:uppercase;letter-spacing:.09em;color:var(--ink2)}
.sec small{font-size:13px}
.empty,.hint{margin:8px 12px;color:var(--ink2);font-size:14px;line-height:1.35}
.card{margin:8px 10px;border:1.5px solid var(--line);background:var(--card)}
.card>header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 9px;border-bottom:1.5px solid var(--line);background:var(--head)}
.card h3{margin:0;font:700 15px/1.2 var(--cond)}
.card header span{font:700 12px var(--cond);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--ink2)}
.cells{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border-bottom:1.5px solid var(--line)}
.cell{padding:3px 9px;border-right:1.5px solid var(--line);min-width:0}
.cell:last-child{border-right:0}
.cell small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);white-space:nowrap}
.cell b{display:block;font:700 15px/1.25 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bad{color:var(--bad)}.good{color:var(--good)}
.cota{position:relative;height:24px;margin:2px 10px}
.cota .ln{position:absolute;left:0;right:0;top:50%;height:1.5px;background:var(--line);transform:translateY(-50%)}
.cota .e{position:absolute;top:3px;bottom:3px;width:1.5px;background:var(--line)}
.cota .e.l{left:0}.cota .e.r{right:0}
.cota b{position:absolute;left:0;top:50%;height:7px;transform:translateY(-50%);background:var(--yellow);opacity:.9}
.cota.late b{background:#F0524F}
.cota span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--card);padding:0 7px;font:700 12px var(--cond);white-space:nowrap}
.btns{display:flex;flex-wrap:wrap;gap:6px;padding:7px 8px}
.btn{min-height:44px;flex:1 1 140px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:15px;text-align:left}
.btn span{flex:1}
.btn em{font:700 15px var(--cond);font-style:normal;white-space:nowrap}
.btn.pri{background:var(--yellow);color:#123A5E;border-color:#123A5E}
.btn:disabled{opacity:.45}
.btn.dng{border-color:var(--bad);color:var(--bad)}
.btn.warn{background:var(--bad);color:#fff;border-color:var(--bad);opacity:1}
.row{display:flex;align-items:center;gap:10px;margin:8px 10px;padding:6px 10px;min-height:48px;border:1.5px solid var(--line);background:var(--card)}
.row span{flex:1;font-weight:600}
.switch{width:56px;height:44px;border:0;background:none;position:relative;flex:0 0 56px}
.switch::before{content:"";position:absolute;left:4px;right:4px;top:11px;height:22px;border:1.5px solid var(--line);background:var(--head);border-radius:12px}
.switch i{position:absolute;top:14px;left:8px;width:16px;height:16px;border-radius:50%;background:var(--ink2);transition:left .15s}
.switch.on::before{background:var(--yellow);border-color:#123A5E}
.switch.on i{left:32px;background:#123A5E}
.miles{display:flex;align-items:center;gap:6px;padding:6px 9px;border-bottom:1.5px solid var(--line);font-size:12px;color:var(--ink2)}
.ms{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:700 11px var(--cond);color:var(--ink2)}
.ms.on{background:var(--yellow);color:#123A5E;border-color:#123A5E}
.desc{padding:5px 9px;font-size:13px;color:var(--ink2);border-bottom:1.5px solid var(--line)}
.works{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 10px}
.wk{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);background:var(--card);padding:4px 6px;min-width:0}
.wk img{width:30px;height:30px;flex:0 0 30px}
.wk b{display:block;font:700 12px/1.15 var(--cond);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 10px}
.chips span{border:1.5px solid var(--line);background:var(--card);padding:3px 8px;font:600 12px var(--cond)}
textarea{display:block;width:calc(100% - 20px);margin:6px 10px;min-height:64px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:12px/1.3 ui-monospace,Menlo,monospace;padding:6px;-webkit-user-select:text;user-select:text;resize:none}
#modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(6,20,34,.62);padding:20px}
#modal.on{display:flex}
#modal .box{width:100%;max-width:400px;background:var(--bg);border:2px solid var(--yellow);animation:pop .22s ease-out;max-height:84%;overflow:auto}
#modal .box h2{margin:0;padding:9px 12px;background:var(--head);border-bottom:1.5px solid var(--line);font:700 19px var(--cond)}
#modal .bd{padding:6px 0}
#modal .card{margin:6px 10px}
@keyframes pop{from{transform:scale(.88);opacity:0}}
#cele{position:fixed;left:50%;top:50%;z-index:9;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;text-align:center;background:var(--yellow);color:#123A5E;border:2px solid #fff;padding:10px 22px 12px;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:90%}
#cele.on{animation:cele 2.8s ease-out forwards}
#cele b{display:block;font:700 22px var(--cond);text-transform:uppercase;letter-spacing:.04em}
#cele span{display:block;font:600 15px var(--cond)}
@keyframes cele{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}12%{transform:translate(-50%,-50%) scale(1.08);opacity:1}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}
#toast{position:fixed;left:50%;transform:translateX(-50%);z-index:9;max-width:92%;background:#fff;color:#12283A;border:1.5px solid #123A5E;border-left:6px solid var(--bad);padding:8px 12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;text-align:left}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}#cele.on{animation:none;opacity:1;transform:translate(-50%,-50%)}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Oficina técnica en vista isométrica"></canvas>
<div id="hud">
  <div class="grid">
    <div class="chip" id="chCash"><span class="lb">Caja</span><span class="vl" id="vCash">0 €</span><span class="sb" id="sCash">+0 €/min</span><i class="bar"><b id="bCash"></b></i></div>
    <div class="chip" id="chRep"><span class="lb">Reputación</span><span class="vl" id="vRep">0</span><span class="sb" id="sRep">Próximo cliente: 10</span></div>
    <div class="chip row2" id="chStaff"><span class="lb">Plantilla</span><span class="vl" id="vStaff">0/3</span><span class="sb" id="sStaff">Nóminas 0 €/s</span></div>
    <div class="chip row2" id="chCap"><span class="lb">Capacidad</span><span class="vl" id="vCap">1 h/s</span><span class="sb" id="sCap">Ritmo de trabajo</span></div>
  </div>
  <div id="strip"></div>
</div>
<button id="fit" aria-label="Encuadrar la oficina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><rect x="9" y="9" width="6" height="6"/></svg></button>
<div id="streak"></div>
<div id="goal" role="status"><div class="tx"><div class="t" id="gT"></div><div class="pb"><b id="gB"></b></div><div class="pt" id="gP"></div></div><button id="claim" disabled>Cobrar</button></div>
<div id="sheet" role="dialog" aria-label="Panel"><div id="shead"><h2 id="sTitle">Encargos</h2><button id="sMin" aria-label="Minimizar panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button><button id="sClose" aria-label="Cerrar panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="sbody"></div></div>
<nav id="nav">
  <button data-nav="jobs" aria-label="Encargos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="1.5"/><path d="M9 4V3h6v1M8.5 10h7M8.5 14h7M8.5 17.5h4"/></svg>Encargos<i class="badge" id="bdJobs"></i></button>
  <button data-nav="team" aria-label="Equipo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.3"/><path d="M2.8 20c.4-3.6 3-5.6 6.2-5.6s5.8 2 6.2 5.6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.3c2.6.1 4.2 1.8 4.4 4.7"/></svg>Equipo<i class="badge" id="bdTeam"></i></button>
  <button data-nav="upg" aria-label="Mejoras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.2a4 4 0 0 0 4.6 4.6l-8.6 8.6a2.3 2.3 0 0 1-3.3-3.3l8.6-8.6a4 4 0 0 0-1.3-1.3z" transform="translate(-1 -1)"/><path d="M17 3l.7 1.8L19.5 5.5l-1.8.7L17 8l-.7-1.8-1.8-.7 1.8-.7z"/></svg>Mejoras<i class="badge" id="bdUpg"></i></button>
  <button data-nav="sede" aria-label="Sede"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V9l8-5 8 5v12M2.5 21h19M9 21v-6h6v6M9 11h.01M15 11h.01"/></svg>Sede<i class="badge" id="bdSede"></i></button>
</nav>
<div id="modal"><div class="box" id="mbox" role="dialog"></div></div>
<div id="cele"><b id="cT"></b><span id="cS"></span></div>
<div id="toast" role="alert"></div>
<script>
'use strict';
/* ===== LÓGICA DEL JUEGO (sin DOM) ===== */
const KEY = 'oficina-tecnica-v2';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);

const LV = [null,
  { n: 'Licencias y certificados', h: 12, eh: 9, rep: 0, gain: 1, spd: 0.8, names: ['Certificado de eficiencia energética', 'Licencia de apertura de local', 'Cédula de habitabilidad', 'Informe técnico de inspección', 'Certificado final de obra'] },
  { n: 'Reformas y cálculo de vigas', h: 120, eh: 7, rep: 10, gain: 2, spd: 4, names: ['Cálculo de vigas para un ático', 'Reforma integral de un piso', 'Refuerzo de forjado en vivienda', 'Apertura de hueco en muro de carga', 'Proyecto de reforma de local'] },
  { n: 'Naves industriales', h: 900, eh: 9, rep: 50, gain: 5, spd: 25, names: ['Nave logística de 2.000 m²', 'Nave industrial con puente grúa', 'Taller metálico de 800 m²', 'Almacén frigorífico', 'Nave agrícola de 1.500 m²'] },
  { n: 'Edificios', h: 6000, eh: 12, rep: 400, gain: 10, spd: 150, names: ['Edificio de 24 viviendas', 'Torre de oficinas de 12 plantas', 'Hotel de 90 habitaciones', 'Centro comercial', 'Residencia de mayores'] },
  { n: 'Infraestructuras', h: 45000, eh: 16, rep: 15000, gain: 25, spd: 900, names: ['Puente de vigas pretensadas', 'Túnel urbano de 1,2 km', 'Viaducto ferroviario', 'Estación de metro', 'Presa de gravedad'] },
  { n: 'Grandes plantas', h: 320000, eh: 22, rep: 120000, gain: 60, spd: 5000, names: ['Planta fotovoltaica de 50 MW', 'Central de ciclo combinado', 'Parque eólico marino', 'Planta desaladora', 'Refinería de biocombustibles'] }
];
const LVCOL = [null, '#F2B705', '#5BC0EB', '#9BC53D', '#FA7921', '#E55934', '#B388EB'];

const STAFF = [
  { id: 'delineante', n: 'Delineante', base: 120, gr: 1.25, hs: 0.5, pay: 1, rep: 0, mil: 1, col: '#3B82C4', d: 'Dibuja planos y detalles.' },
  { id: 'junior', n: 'Ingeniero junior', base: 1100, gr: 1.25, hs: 2.2, pay: 5, rep: 5, mil: 1, col: '#3FA46A', d: 'Calcula estructuras sencillas.' },
  { id: 'revisor', n: 'Revisor técnico', base: 3000, gr: 1.4, hs: 0, pay: 7, rep: 8, col: '#F4F6F8', d: 'Reduce las revisiones del cliente.' },
  { id: 'jefe', n: 'Jefe de proyecto', base: 6000, gr: 1, hs: 0, pay: 10, rep: 12, max: 1, col: '#2B2F3A', d: 'Acepta encargos por ti. Tiene despacho propio.' },
  { id: 'senior', n: 'Ingeniero senior', base: 9000, gr: 1.25, hs: 11, pay: 30, rep: 40, mil: 1, col: '#E39B1B', d: 'Resuelve los cálculos más duros.' }
];
const SMAP = {}; STAFF.forEach(s => SMAP[s.id] = s);

/* ---- formato ---- */
function fmt(n) {
  if (!isFinite(n)) return '∞';
  const neg = n < 0; let a = Math.abs(n), s;
  if (a < 1000) s = String(Math.floor(a));
  else {
    const U = ['k', 'M', 'MM', 'B', 'BB', 'T']; let i = -1;
    while (a >= 1000 && i < U.length - 1) { a /= 1000; i++; }
    const dg = a < 10 ? 2 : a < 100 ? 1 : 0;
    let ns = (Math.floor(a * Math.pow(10, dg) + 1e-9) / Math.pow(10, dg)).toFixed(dg);
    if (dg > 0) ns = ns.replace(/0+$/, '').replace(/\.$/, '');
    s = ns.replace('.', ',') + U[i];
  }
  return (neg ? '−' : '') + s;
}
function fmtD(x) { // decimales para h/s
  if (x >= 10) return fmt(x);
  const v = Math.round(x * 10) / 10;
  return String(v).replace('.', ',');
}
const eur = n => fmt(n) + ' €';
function fmtT(s) {
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + ' s';
  if (s < 3600) return Math.floor(s / 60) + ' min ' + (s % 60 ? (s % 60) + ' s' : '');
  return Math.floor(s / 3600) + ' h ' + Math.floor((s % 3600) / 60) + ' min';
}

/* ---- estado ---- */
function defState() {
  return {
    v: 2, cash: 0, rep: 0, total: 0, deliv: 0, revs: 0, sedes: 0,
    staff: { delineante: 0, junior: 0, revisor: 0, jefe: 0, senior: 0 },
    off: 0, sala: 0, upg: {}, queue: [null, null, null, null], active: [],
    boss: false, goal: 0, works: [], flags: {}, sound: true, maxLv: 1, seen: Date.now()
  };
}
let S = defState();
const D = { cap: 1, capBase: 1, pay: 0, fee: 1, rev: 1, repm: 1, emp: 0, used: 0, seats: 3, slots: 1 };
const rt = {
  clock: 0, jid: 1, eligKey: null, refill: [0, 0, 0, 0], searchCd: 0, streak: 0, lastTap: -9, incQ: [], incAcc: 0, incT: 0,
  gift: null, giftNext: 9, bossT: 0, goalCel: -1, sim: false, elT: 0, tapLock: -9, lastSave: 0, popT: {}, newWork: -9
};
const H = { // ganchos de efectos (los sobreescribe la interfaz)
  toast() { }, cele() { }, sfx() { }, earn() { }, deliver() { }, accept() { }, requeue() { }, tap() { }, giftGot() { }, hire() { }, buy() { }, closeModal() { }
};

function recalc() {
  let hs = 0, pay = 0, emp = 0;
  for (const r of STAFF) {
    const n = S.staff[r.id] || 0; emp += n; pay += r.pay * n;
    if (r.hs) hs += r.hs * n * milMult(r.id);
  }
  let prod = 1, fee = 1, rev = 1, repm = 1;
  for (const u of UPG) if (S.upg[u.id]) { prod *= u.prod || 1; fee *= u.fee || 1; rev *= u.rev || 1; repm *= u.repm || 1; }
  prod *= 1 + 0.25 * S.sedes;
  D.capBase = (1 + hs) * prod; D.cap = D.capBase * (S.cash < 0 ? 0.6 : 1);
  D.pay = pay; D.fee = fee; D.rev = rev; D.repm = repm; D.emp = emp;
  D.used = emp - (S.staff.jefe || 0); D.seats = 3 + 2 * S.off; D.slots = 1 + S.sala; D.prod = prod;
}
function milCount(id) { const n = S.staff[id] || 0; return MILES.filter(k => n >= k).length; }
function milMult(id) { return SMAP[id].mil ? Math.pow(1.5, milCount(id)) : 1; }
function roleHs(id) { return SMAP[id].hs * (S.staff[id] || 0) * milMult(id) * D.prod; }

/* ---- encargos ---- */
function eligible() {
  const e = [1];
  for (let l = 2; l <= 6; l++) if (S.rep >= LV[l].rep && LV[l].spd <= D.capBase * 6) e.push(l);
  return e;
}
function genJob() {
  const el = eligible(); let tot = 0; el.forEach(l => tot += l * l);
  let r = Math.random() * tot, lv = 1;
  for (const l of el) { r -= l * l; if (r <= 0) { lv = l; break; } }
  const L = LV[lv];
  const hours = Math.max(1, Math.round(L.h * rnd(0.8, 1.25)));
  const fee = Math.max(1, Math.round(hours * L.eh * rnd(0.9, 1.15)));
  const plazo = Math.round(hours / L.spd * rnd(1.1, 1.5) + 20);
  return { id: rt.jid++, lv, name: L.names[Math.floor(Math.random() * L.names.length)], hours, fee, plazo, t: plazo, done: 0, urgent: false, reviewed: false };
}
function updateElig() {
  const el = eligible(), key = el.join(), first = rt.eligKey === null;
  if (key !== rt.eligKey) {
    rt.eligKey = key;
    if (!first) { for (let i = 0; i < 4; i++) if (S.queue[i]) { S.queue[i] = genJob(); H.requeue(i); } H.closeModal(); }
    const mx = el[el.length - 1];
    if (mx > S.maxLv) { S.maxLv = mx; if (!first && !rt.sim) { H.cele('Nuevos clientes', LV[mx].n); H.sfx('cele'); } }
  }
}
function searchOthers() {
  if (rt.searchCd > 0) return false;
  for (let i = 0; i < 4; i++) if (S.queue[i]) { S.queue[i] = genJob(); H.requeue(i); }
  rt.searchCd = 8; H.sfx('tap'); H.closeModal(); return true;
}
function jobTotal(j) { return j.hours * (j.reviewed ? 1.35 : 1); }
function reviewP(j) { return clamp(0.2 * (j.urgent ? 2.5 : 1) / (1 + 0.5 * S.staff.revisor) * D.rev, 0.01, 0.85); }
function acceptJob(i, auto) {
  const j = S.queue[i];
  if (!j) return false;
  if (S.active.length >= D.slots) { if (!auto) H.toast('La mesa de proyectos está llena', 'err'); return false; }
  S.queue[i] = null; j.t = j.plazo; S.active.push(j); S.flags.accepted = true;
  rt.refill[i] = 1.4; H.accept(i, j); H.sfx('buy'); return true;
}
function earn(a) {
  S.cash += a; S.total += a; rt.incQ.push([rt.clock, a]); rt.incAcc += a;
}
function income60() {
  let s = 0; for (const q of rt.incQ) if (rt.clock - q[0] < 60) s += q[1];
  return s * 60 / Math.min(60, Math.max(8, rt.clock));
}
function addWork(j, dh) {
  const before = j.done; j.done += dh;
  const pH = Math.max(0, Math.min(j.done, j.hours) - Math.min(before, j.hours));
  if (pH > 0) { const p = j.fee * 0.5 * pH / j.hours * D.fee; earn(p); if (!rt.sim) H.earn(p, j); }
}
function checkDeliver(j) {
  if (S.active.indexOf(j) < 0 || j.done < jobTotal(j) - 1e-7) return false;
  if (!j.reviewed && Math.random() < reviewP(j)) {
    j.reviewed = true; j.urgent = false; S.revs++;
    if (!rt.sim) { H.toast('El cliente pide revisiones: «' + j.name + '» (+35 % de horas)', 'err'); H.sfx('err'); }
    return false;
  }
  const late = j.t < 0;
  const fin = j.fee * 0.5 * D.fee * (late ? 0.6 : 1) * (j.reviewed ? 0.9 : 1);
  earn(fin);
  const rp = LV[j.lv].gain * D.repm * (late ? 0.5 : 1);
  S.rep += rp; S.deliv++;
  const ix = S.active.indexOf(j);
  S.active.splice(ix, 1);
  S.works.unshift({ lv: j.lv, name: j.name, fee: Math.round(j.fee) }); if (S.works.length > 24) S.works.length = 24;
  rt.newWork = rt.clock;
  if (!rt.sim) H.deliver(j, fin, rp, late, ix);
  return true;
}
function handTap(idx) {
  const j = S.active[idx]; if (!j) return 0;
  if (rt.clock - rt.lastTap < 0.8) rt.streak = Math.min(30, rt.streak + 1); else rt.streak = 1;
  rt.lastTap = rt.clock; S.flags.tapped = true;
  const adv = (1.5 + D.cap * 0.15 + j.hours * 0.005) * (1 + Math.min(2, (rt.streak - 1) * 0.08));
  const dh = Math.min(adv, jobTotal(j) - j.done);
  addWork(j, dh);
  H.tap(idx, adv, rt.streak);
  checkDeliver(j);
  return adv;
}
function toggleUrgent(j) { j.urgent = !j.urgent; H.sfx('tap'); }
function prioritize(j) { const i = S.active.indexOf(j); if (i > 0) { S.active.splice(i, 1); S.active.unshift(j); H.sfx('tap'); } }
function estTime(idx) {
  let rem = 0; for (let i = 0; i <= idx; i++) rem += jobTotal(S.active[i]) - S.active[i].done;
  const j = S.active[idx];
  return rem / Math.max(0.01, D.cap) / (j.urgent ? 1.4 : 1);
}

/* ---- tick ---- */
function tick(dt) {
  rt.clock += dt; recalc();
  S.cash -= D.pay * dt;
  let avail = D.cap * dt;
  for (const j of S.active) {
    if (avail <= 1e-12) break;
    const m = j.urgent ? 1.4 : 1, need = jobTotal(j) - j.done, can = Math.min(need, avail * m);
    if (can > 0) { addWork(j, can); avail -= can / m; }
  }
  for (const j of S.active) j.t -= dt;
  for (const j of S.active.slice()) checkDeliver(j);
  for (let i = 0; i < 4; i++) if (!S.queue[i]) { rt.refill[i] -= dt; if (rt.refill[i] <= 0) { S.queue[i] = genJob(); H.requeue(i); } }
  rt.searchCd = Math.max(0, rt.searchCd - dt);
  rt.elT -= dt; if (rt.elT <= 0) { rt.elT = 0.5; updateElig(); }
  // jefe de proyecto
  if (S.boss && S.staff.jefe > 0 && S.active.length < D.slots) {
    rt.bossT -= dt;
    if (rt.bossT <= 0) { rt.bossT = rt.sim ? 0 : 0.9; bossPick(); }
  }
  // recorte de ingresos
  rt.incT -= dt;
  if (rt.incT <= 0) { rt.incT = 2; while (rt.incQ.length && rt.clock - rt.incQ[0][0] > 61) rt.incQ.shift(); }
  if (!rt.sim) {
    // regalo
    if (rt.gift) { rt.gift.age += dt; if (rt.gift.age > 15) rt.gift = null; }
    else { rt.giftNext -= dt; if (rt.giftNext <= 0) { rt.giftNext = rnd(25, 40); H.giftSpawn(); } }
    // objetivo cumplido
    const g = GOALS[S.goal];
    if (g && g[2]() >= g[3] && rt.goalCel !== S.goal) { rt.goalCel = S.goal; H.cele('Objetivo cumplido', g[0]); H.sfx('cele'); }
  }
}
H.giftSpawn = () => { };
function bossPick() {
  let best = -1, bs = -1;
  let rem = 0; for (const a of S.active) rem += jobTotal(a) - a.done;
  for (let i = 0; i < 4; i++) {
    const j = S.queue[i]; if (!j) continue;
    const ok = (rem + j.hours) / Math.max(0.01, D.cap) <= j.plazo;
    const sc = j.fee * (ok ? 1 : 0.3);
    if (sc > bs) { bs = sc; best = i; }
  }
  if (best >= 0) acceptJob(best, true);
}
function claimGift() {
  if (!rt.gift) return 0;
  const a = Math.max(40, 0.5 * income60()); earn(a); rt.gift = null; return a;
}

/* ---- compras ---- */
function staffCost(id) { const r = SMAP[id]; return Math.ceil(r.base * Math.pow(r.gr, S.staff[id])); }
function hireState(id) { // null = se puede; texto = motivo
  const r = SMAP[id];
  if (r.max && S.staff[id] >= r.max) return 'Ya contratado';
  if (S.rep < r.rep) return 'Necesita reputación ' + r.rep;
  if (id !== 'jefe' && D.used >= D.seats) return 'Sin puestos libres';
  return null;
}
function hire(id) {
  recalc();
  if (hireState(id)) return false;
  const c = staffCost(id); if (S.cash < c) return false;
  const before = milCount(id);
  S.cash -= c; S.staff[id]++; recalc(); updateElig();
  H.hire(id);
  if (SMAP[id].mil && milCount(id) > before && !rt.sim) { H.cele('Hito de plantilla', SMAP[id].n + ' ×' + S.staff[id] + ': producción ×1,5'); H.sfx('cele'); }
  return true;
}
function offCost() { return Math.ceil(300 * Math.pow(1.75, S.off)); }
function salaCost() { return 3000 * Math.pow(5, S.sala); }
function buyOffice() { const c = offCost(); if (S.cash < c) return false; S.cash -= c; S.off++; recalc(); H.buy('office'); return true; }
function buySala() { if (S.sala >= 4) return false; const c = salaCost(); if (S.cash < c) return false; S.cash -= c; S.sala++; recalc(); H.buy('sala'); return true; }
function buyUpg(id) {
  const u = UMAP[id]; if (S.upg[id] || S.rep < u.rep || S.cash < u.c) return false;
  S.cash -= u.c; S.upg[id] = true; rt.popT[id] = rt.clock; recalc(); updateElig(); H.buy(id); return true;
}
function upgText(u) {
  const f = x => String(x).replace('.', ',');
  const a = [];
  if (u.prod) a.push('producción ×' + f(u.prod));
  if (u.fee) a.push('honorarios ×' + f(u.fee));
  if (u.rev) a.push('revisiones ×' + f(u.rev));
  if (u.repm) a.push('reputación ×' + f(u.repm));
  const s = a.join(' y '); return s.charAt(0).toUpperCase() + s.slice(1);
}
function cheapestBuy() {
  let best = null;
  const add = (c, ok) => { if (ok && (best === null || c < best)) best = c; };
  for (const r of STAFF) if (!hireState(r.id)) add(staffCost(r.id), true);
  for (const u of UPG) if (!S.upg[u.id] && S.rep >= u.rep) add(u.c, true);
  add(offCost(), true); if (S.sala < 4) add(salaCost(), true);
  return best;
}
function anyAffordable(kind) {
  if (kind === 'team') return STAFF.some(r => !hireState(r.id) && S.cash >= staffCost(r.id));
  return UPG.some(u => !S.upg[u.id] && S.rep >= u.rep && S.cash >= u.c) || S.cash >= offCost() || (S.sala < 4 && S.cash >= salaCost());
}
function nextClientRep() {
  for (let l = 2; l <= 6; l++) if (S.rep < LV[l].rep) return LV[l].rep;
  return null;
}
function nextLevelHint() {
  for (let l = 2; l <= 6; l++) {
    const L = LV[l];
    if (S.rep < L.rep) return 'Siguiente nivel: «' + L.n + '». Te faltan ' + fmt(Math.ceil(L.rep - S.rep)) + ' de reputación.';
    if (L.spd > D.capBase * 6) return 'Siguiente nivel: «' + L.n + '». Necesitas una capacidad de ' + fmtD(L.spd / 6) + ' h/s (ahora ' + fmtD(D.capBase) + ' h/s).';

/* ---- objetivos ---- */
function goalInfo() {
  const g = GOALS[S.goal]; if (!g) return null;
  const cur = Math.min(g[3], g[2]());
  return { t: g[0], r: g[1], cur, max: g[3], ready: cur >= g[3] };
}

  S.cash += g.r; S.goal++; rt.goalCel = -1; return g.r;

/* ---- sede ---- */
function sedePts() { return Math.max(0, Math.floor(Math.sqrt(S.total / 250000)) - S.sedes); }
function openSede() {
  const p = sedePts(); if (p < 1) return false;
  const keep = { sedes: S.sedes + p, total: S.total, deliv: S.deliv, revs: S.revs, goal: S.goal, works: S.works, flags: S.flags, sound: S.sound };
  const n = defState(); Object.assign(n, keep, { maxLv: 1 });
  S = n; rt.eligKey = null; recalc(); updateElig();

/* ---- guardado ---- */
function okJob(j) {
  return j && typeof j === 'object' && LV[j.lv] && [j.hours, j.fee, j.plazo, j.t, j.done].every(Number.isFinite) && j.hours > 0;
}
function cleanJob(j) {
  return { id: rt.jid++, lv: j.lv | 0, name: String(j.name || '').slice(0, 80), hours: j.hours, fee: j.fee, plazo: j.plazo, t: j.t, done: Math.max(0, j.done), urgent: !!j.urgent, reviewed: !!j.reviewed };
}
function normalize(o) {
  if (!o || typeof o !== 'object') return null;
  const d = defState();
  for (const k of ['cash', 'rep', 'total', 'deliv', 'revs', 'sedes', 'off', 'sala', 'goal', 'maxLv', 'seen']) if (Number.isFinite(o[k])) d[k] = o[k];
  d.rep = Math.max(0, d.rep); d.off = clamp(d.off | 0, 0, 999); d.sala = clamp(d.sala | 0, 0, 4); d.goal = clamp(d.goal | 0, 0, GOALS.length);
  d.maxLv = clamp(d.maxLv | 0, 1, 6); d.sedes = Math.max(0, d.sedes | 0);
  if (o.staff && typeof o.staff === 'object') for (const r of STAFF) if (Number.isFinite(o.staff[r.id])) d.staff[r.id] = Math.max(0, o.staff[r.id] | 0);
  if (d.staff.jefe > 1) d.staff.jefe = 1;
  if (o.upg && typeof o.upg === 'object') for (const u of UPG) if (o.upg[u.id]) d.upg[u.id] = true;
  if (o.flags && typeof o.flags === 'object') { d.flags.accepted = !!o.flags.accepted; d.flags.tapped = !!o.flags.tapped; }
  d.boss = !!o.boss; d.sound = o.sound !== false;
  if (Array.isArray(o.queue)) for (let i = 0; i < 4; i++) if (okJob(o.queue[i])) { d.queue[i] = cleanJob(o.queue[i]); d.queue[i].done = 0; }
  if (Array.isArray(o.active)) d.active = o.active.filter(okJob).slice(0, 5).map(cleanJob);
  if (Array.isArray(o.works)) d.works = o.works.filter(w => w && LV[w.lv]).slice(0, 24).map(w => ({ lv: w.lv | 0, name: String(w.name || '').slice(0, 80), fee: Number(w.fee) || 0 }));
  return d;
}
function saveGame() {
  try { S.seen = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
}
function loadGame() {
  try { const raw = localStorage.getItem(KEY); if (!raw) return null; return normalize(JSON.parse(raw)); } catch (e) { return null; }
}
function exportCode() {
  const b = new TextEncoder().encode(JSON.stringify(Object.assign({}, S, { seen: Date.now() })));
  let s = ''; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s);
}
function importCode(code) {
  try {
    const bin = atob(String(code).replace(/\s+/g, ''));
    const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    const o = normalize(JSON.parse(new TextDecoder().decode(b)));
    if (!o) return false;

  } catch (e) { return false; }
}

/* ---- sin conexión ---- */
function simulateOffline(sec) {
  sec = Math.min(sec, 8 * 3600);
  const b = { cash: S.cash, deliv: S.deliv, revs: S.revs, rep: S.rep };
  let t = 0, closed = false; const step = sec > 3600 ? 2 : 1;
  rt.sim = true;

  document.body.classList.add('pan'); const sh = $('#sheet'); sh.classList.add('open'); sh.classList.remove('min');
  $('#sTitle').textContent = TITLES[name]; $('#sbody').scrollTop = 0;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('act', b.dataset.nav === name));
  layout(); setCamT(fitCam()); refreshPanel(true);
}
function closePanel() {
  UI.panel = null; UI.min = false;
  document.body.classList.remove('pan'); $('#sheet').classList.remove('open', 'min');
  document.querySelectorAll('#nav button').forEach(b => b.classList.remove('act'));
  layout();
  if (camSaved) { camMode = camSaved.mode; setCamT(camSaved); camSaved = null; } else applyCamMode();
}
function toggleMin() {
  UI.min = !UI.min; $('#sheet').classList.toggle('min', UI.min);
  $('#sMin').setAttribute('aria-label', UI.min ? 'Expandir panel' : 'Minimizar panel');
  $('#sMin svg').style.transform = UI.min ? 'rotate(180deg)' : '';
  layout(); setCamT(fitCam()); if (!UI.min) refreshPanel(true);
}

/* ---- modal ---- */
function openModal(slot) {
  const j = S.queue[slot]; if (!j) return;
  UI.modal = slot; renderModal(); $('#modal').classList.add('on');
}
function closeModal() { UI.modal = null; UI.offline = null; $('#modal').classList.remove('on'); }
function renderModal() {
  const box = $('#mbox');
  if (UI.offline) {
    const o = UI.offline;
    box.innerHTML = '<h2>Mientras no estabas</h2><div class="bd"><div class="card"><div class="cells">' + cell('Tiempo', fmtT(o.secs)) + cell('Entregas', o.dDeliv) + cell('Revisiones', o.dRevs) + '</div><div class="cells">' + cell('Caja', (o.dCash >= 0 ? '+' : '') + eur(o.dCash), o.dCash >= 0 ? 'good' : 'bad') + cell('Reputación', '+' + fmt(Math.floor(o.dRep))) + '</div></div>' +
      (o.closed ? '<p class="hint"><b>La oficina cerró</b> tras ' + fmtT(o.worked) + ': no quedaban proyectos activos ni jefe de proyecto. No se pagaron nóminas ni se trabajó más. Deja encargos en la mesa o contrata un jefe de proyecto antes de irte.</p>' : '') +
      '<div class="btns">' + btn('close', 'Continuar', null, { pri: true }) + '</div></div>';
    return;
  }
  const j = S.queue[UI.modal]; if (!j) { closeModal(); return; }
  const free = S.active.length < D.slots, ok = j.hours / Math.max(0.01, D.cap) <= j.plazo;
  box.innerHTML = '<h2>Nuevo encargo</h2><div class="bd">' + card(j.name, 'Nv ' + j.lv,
    '<div class="cells">' + cell('Horas', fmt(j.hours) + ' h') + cell('Plazo', fmtT(j.plazo), ok ? '' : 'bad') + cell('Honorarios', eur(j.fee * D.fee)) + '</div><div class="cells">' + cell('Tipo', esc(LV[j.lv].n)) + cell('Reputación', '+' + LV[j.lv].gain * D.repm) + '</div>') +
    '<div class="btns">' + btn('macc:' + UI.modal, free ? 'Aceptar encargo' : 'Mesa llena', null, { pri: true, dis: !free }) + btn('close', 'Cerrar') + '</div></div>';
}

/* ---- avisos ---- */
let toastT = 0, celeT = 0;
H.toast = (m, kind) => {
  const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200);
};
H.cele = (title, sub) => {
  const c = $('#cele'); $('#cT').textContent = title; $('#cS').textContent = sub;
  c.classList.remove('on'); void c.offsetWidth; c.classList.add('on'); confetti();
};

/* ---- HUD ---- */
const hs = {};
function setT(id, v) { if (hs[id] !== v) { hs[id] = v; $('#' + id).textContent = v; } }
function hudUpdate(dt) {
  rt.shown += (S.cash - rt.shown) * Math.min(1, dt * 9); if (Math.abs(S.cash - rt.shown) < 0.5) rt.shown = S.cash;
  setT('vCash', (rt.shown < 0 ? '−' : '') + eur(Math.abs(rt.shown)));
  $('#chCash').classList.toggle('neg', S.cash < 0);
  setT('sCash', '+' + eur(income60()) + '/min');
  const cb = cheapestBuy(), pct = cb ? clamp(S.cash / cb, 0, 1) : 0;
  const bw = (pct * 100).toFixed(0) + '%'; if (hs.bw !== bw) { hs.bw = bw; $('#bCash').style.width = bw; }
  $('#chCash').classList.toggle('glow', !!cb && S.cash >= cb);
  setT('vRep', fmt(Math.floor(S.rep)));
  const nr = nextClientRep(); setT('sRep', nr ? 'Próximo cliente: ' + fmt(nr) : 'Todos los clientes');
  setT('vStaff', D.used + '/' + D.seats); setT('sStaff', 'Nóminas ' + fmtD(D.pay) + ' €/s');
  setT('vCap', fmtD(D.cap) + ' h/s'); $('#chCap').classList.toggle('neg', S.cash < 0); setT('sCap', S.cash < 0 ? 'Caja negativa: −40 %' : 'Ritmo de trabajo');
}
function stripUpdate() {
  let h = '';
  S.active.forEach((j, i) => {
    const late = j.t < 0 || estTime(i) > j.t, p = clamp(j.done / jobTotal(j), 0, 1);
    h += '<button class="mini' + (late ? ' late' : '') + '" data-nav="jobs" aria-label="Abrir encargos"><b>' + esc(j.name) + '</b><span><em style="font-style:normal">' + (j.t < 0 ? 'Vencido' : fmtT(j.t)) + '</em><em style="font-style:normal">' + Math.floor(p * 100) + ' %</em></span><i style="width:' + (p * 100).toFixed(1) + '%"></i></button>';
  });
  if (h !== hs.strip) { hs.strip = h; $('#strip').innerHTML = h; layout(); }
}
function goalUpdate() {
  const gi = goalInfo(), el = $('#goal');
  if (!gi) { el.style.display = 'none'; return; }
  el.style.display = '';
  const gh = esc(gi.t);
  if (hs.gh !== gh) { hs.gh = gh; $('#gT').innerHTML = gh; }
  const w = (gi.cur / gi.max * 100).toFixed(1) + '%'; if (hs.gw !== w) { hs.gw = w; $('#gB').style.width = w; }
  setT('gP', 'Objetivo ' + (S.goal + 1) + '/' + GOALS.length + ' · ' + fmt(gi.cur) + ' / ' + fmt(gi.max));
  const c = $('#claim'); c.disabled = !gi.ready; c.classList.toggle('ready', gi.ready);
  const t = gi.ready ? 'Cobrar +' + eur(gi.r) : '+' + eur(gi.r); if (hs.cl !== t) { hs.cl = t; c.textContent = t; }
}
function badgeUpdate() {
  const free = S.active.length < D.slots, nq = S.queue.filter(Boolean).length;
  const set = (id, v) => { const e = $(id); if (e.textContent !== v) e.textContent = v; };
  set('#bdJobs', free && nq ? String(nq) : '');
  set('#bdTeam', anyAffordable('team') ? '!' : '');
  set('#bdUpg', anyAffordable('upg') ? '!' : '');
  set('#bdSede', sedePts() >= 1 ? '!' : '');
}

/* ---- acciones de botones ---- */
function copyText(t) {
  const done = () => H.toast('Código copiado. Pégalo en el otro dispositivo con «Cargar partida».', 'ok');
  const fb = () => { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { H.toast('No se pudo copiar. Selecciona el código manualmente.', 'err'); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fb); else fb();
}
function act(a) {
  audioInit();
  const [n, arg] = a.split(':');
  const jobById = id => S.active.find(j => j.id === +id);
  switch (n) {
    case 'adv': { const j = jobById(arg); if (j) handTapAt(S.active.indexOf(j), true); break; }
    case 'urg': { const j = jobById(arg); if (j) toggleUrgent(j); break; }
    case 'pri': { const j = jobById(arg); if (j) prioritize(j); break; }
    case 'boss': S.boss = !S.boss; sfx('tap'); break;
    case 'acc': acceptJob(+arg); break;
    case 'macc': if (acceptJob(+arg)) closeModal(); break;
    case 'search': searchOthers(); break;
    case 'hire': hire(arg); break;
    case 'office': buyOffice(); break;
    case 'sala': buySala(); break;
    case 'upg': buyUpg(arg); break;
    case 'close': closeModal(); break;
    case 'snd': S.sound = !S.sound; try { localStorage.setItem('oficina-tecnica-snd', S.sound ? '1' : '0'); } catch (e) { } if (S.sound) { audioInit(); sfx('buy'); } break;
    case 'copy': copyText(exportCode()); break;
    case 'load': { const v = ($('#codeTa') || {}).value || ''; if (importCode(v)) { saveGame(); resetScene(); H.toast('Partida cargada.', 'ok'); closePanel(); } else H.toast('El código no es válido.', 'err'); break; }
    case 'sede':
      if (!confirmed('sede')) { UI.conf.sede = Date.now() + 4000; } else {
        UI.conf.sede = 0; const p = openSede(); if (p) { saveGame(); resetScene(); H.cele('Nueva sede abierta', '+' + p + ' sede · +' + (p * 25) + ' % de producción'); sfx('cele'); closePanel(); }
      } break;
    case 'wipe':
      if (!confirmed('wipe')) { UI.conf.wipe = Date.now() + 4000; } else {
        UI.conf.wipe = 0; S = defState(); fillQueue(); saveGame(); resetScene(); closePanel(); H.toast('Partida borrada.', 'err');
      } break;
  }
  refreshPanel(true); badgeUpdate(); goalUpdate();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b && !b.disabled) { act(b.dataset.a); return; }
  const nv = e.target.closest('[data-nav]'); if (nv && !nv.closest('#nav') ) { openPanel(nv.dataset.nav); return; }
});
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-nav]'); if (b) openPanel(b.dataset.nav); });
$('#sClose').addEventListener('click', closePanel);
$('#sMin').addEventListener('click', toggleMin);
$('#claim').addEventListener('click', () => {
  audioInit(); const r = claimGoal();
  if (r) { sfx('gift'); const s = rt.chip; spawnCoins(s.x, s.y + 140, 10); spawnText(W / 2, view.cy, '+' + eur(r), '#4CD98A', 22, 1.4); saveGame(); }
  goalUpdate();
});
$('#fit').addEventListener('click', () => {
  audioInit();
  if (UI.panel) { setCamT(fitCam()); return; }
  camMode = camMode === 'fit' ? 'focus' : 'fit'; camSaved = null; applyCamMode();
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#sbody').addEventListener('pointerdown', () => { rt.ptrDown = true; });
addEventListener('pointerup', () => { setTimeout(() => { rt.ptrDown = false; }, 30); });
addEventListener('pointercancel', () => { rt.ptrDown = false; });

/* ===== PRINCIPAL ===== */
rt.bounce = {}; rt.seatRole = []; rt.fall = {}; rt.seatInit = false; rt.shown = 0; rt.earnAcc = 0; rt.popAcc = 0; rt.tp = null; rt.chip = null; rt.ptrDown = false;
rt.reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

H.requeue = () => { };
H.closeModal = () => { if (UI.modal !== null) closeModal(); };
H.accept = (i, j) => {
  const p = P(SLOTX[i], QY, 60), s = toScreen(p[0], p[1]);
  spawnText(s[0], s[1], 'Encargo aceptado', '#fff', 13, 1.0);
  UI.modal === i && closeModal();
};
H.hire = id => { if (id === 'jefe') rt.popT.jefe = rt.clock; sfx('buy'); };
H.buy = () => { sfx('buy'); };
H.tap = (idx, adv, streak) => {
  const s = planScreen(idx);
  rt.bounce[idx] = 6; spawnSparks(s[0], s[1] + 16, 5);
  if (rt.tp && rt.clock - rt.tp.last < 0.9) { rt.tp.sum += adv; rt.tp.last = rt.clock; rt.tp.x = s[0]; rt.tp.y = s[1]; }
  else rt.tp = { sum: adv, last: rt.clock, x: s[0], y: s[1] };
  sfx('tap', streak);
  const st = $('#streak'); if (streak >= 2) { st.textContent = 'Racha x' + streak; st.classList.add('on'); } rt.streakShow = rt.clock;
};
H.earn = (p, j) => { rt.earnAcc += p; rt.earnIdx = Math.max(0, S.active.indexOf(j)); };
H.deliver = (j, fin, rp, late, ix) => {
  const s = planScreen(Math.max(0, ix || 0));
  spawnText(s[0], s[1] - 6, '+' + eur(fin), '#4CD98A', 26, 1.5, -50);
  spawnText(s[0], s[1] + 20, (late ? 'Entrega tarde · ' : '') + '+' + (Math.round(rp * 10) / 10 + '').replace('.', ',') + ' reputación', late ? '#FFB0AE' : '#F2B705', 14, 1.5, -40);
  spawnCoins(s[0], s[1], 8); spawnSparks(s[0], s[1], 18, ['#F2B705', '#fff', '#5BC0EB']);
  sfx('deliver'); rt.bounce[ix || 0] = 0;
};
H.giftSpawn = () => {
  const spots = [[3.0, 4.4], [5.5, 4.35], [8.0, 4.35], [9.3, 3.0], [4.4, 6.45], [6.6, 6.45], [2.6, 5.7]];
  const s = spots[Math.floor(Math.random() * spots.length)]; rt.gift = { x: s[0], y: s[1], age: 0 };
};

function resetScene() {
  sceneClients.length = 0; rt.seatRole = []; rt.fall = {}; rt.seatInit = false; rt.gift = null; rt.giftNext = 9;
  recalc(); fillQueue(); rt.shown = S.cash; layout(); applyCamMode();
}
function handTapAt(idx, fromBtn) {
  const j = S.active[idx]; if (!j) return;
  handTap(idx);
}
function onCanvasTap(x, y) {
  audioInit();
  let z = null;
  if (rt.clock < rt.tapLock) { const p = pickPlan(x, y, 2.6); if (p) z = p; }
  if (!z) z = pickZone(x, y);
  if (!z) { if (UI.panel) closePanel(); return; }
  switch (z.t) {
    case 'plan': rt.tapLock = rt.clock + 1.5; handTapAt(z.d); break;
    case 'client': openModal(z.d); sfx('tap'); break;
    case 'emp': {
      const r = SMAP[z.d], p = z.d === 'jefe' ? P(9.05, 4.5, 50) : null;
      let txt = r.n + ': ' + (r.hs ? '+' + fmtD(r.hs * milMult(r.id) * D.prod) + ' h/s' : z.d === 'revisor' ? 'menos revisiones' : 'acepta encargos');
      const fs = fromScreen(z.x, z.y - 36); bubbleAt(fs[0], fs[1] + 30, txt); sfx('tap'); break;
    }
    case 'me': { const fs = fromScreen(z.x, z.y - 36); bubbleAt(fs[0], fs[1] + 30, 'Tú: +' + fmtD(D.prod) + ' h/s'); sfx('tap'); break; }
    case 'chair': openPanel('team'); break;
    case 'chairL': openPanel(z.d === 99 ? 'team' : 'upg'); break;
    case 'slotE': if (UI.panel) closePanel(); else openPanel('jobs'); break;
    case 'slotL': if (UI.panel) closePanel(); else openPanel('upg'); break;
    case 'gift': {
      const a = claimGift(); if (a) { spawnCoins(z.x, z.y, 10); spawnText(z.x, z.y - 20, '+' + eur(a), '#4CD98A', 24, 1.5); spawnSparks(z.x, z.y, 16); sfx('gift'); }
      break;
    }
  }
  if (UI.panel) refreshPanel(true);
  badgeUpdate();
}

/* ---- bucle ---- */
let lastTs = 0, saveT = 0, uiT = 0, panT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  let dt = (ts - lastTs) / 1000; lastTs = ts; if (!(dt > 0)) dt = 0.016; dt = Math.min(dt, 0.1);
  tick(dt);
  // ingresos: numeritos y monedas
  rt.popAcc += dt;
  if (rt.popAcc >= 0.7) {
    rt.popAcc = 0;
    if (rt.earnAcc > 0.01 && S.active.length) {
      const s = planScreen(Math.min(rt.earnIdx || 0, S.active.length - 1));
      spawnText(s[0] + rnd(-10, 10), s[1] - 24, '+' + eur(rt.earnAcc), '#4CD98A', 14, 1.0);
      spawnCoins(s[0], s[1], 1 + (rt.earnAcc > 50 ? 1 : 0));
    }
    rt.earnAcc = 0;
  }
  if (rt.streakShow !== undefined && rt.clock - rt.streakShow > 1.1) $('#streak').classList.remove('on');
  fxStep(dt); updateCam(dt);
  render(dt); drawFx();
  hudUpdate(dt);
  uiT -= dt; if (uiT <= 0) { uiT = 0.2; stripUpdate(); goalUpdate(); badgeUpdate(); if (UI.modal !== null) renderModal(); }
  panT -= dt; if (panT <= 0) { panT = 0.25; refreshPanel(false); }
  rt.layT = (rt.layT || 0) - dt; if (rt.layT <= 0) { rt.layT = 0.6; const hb = $('#hud').getBoundingClientRect().bottom; if (Math.abs(hb - (view.top - 4)) > 1) { layout(); applyCamMode(); } else { const cc = $('#chCash').getBoundingClientRect(); rt.chip = { x: cc.left + cc.width / 2, y: cc.top + cc.height / 2 }; } }
  saveT -= dt; if (saveT <= 0) { saveT = 4; saveGame(); }
}

/* ---- sin conexión y visibilidad ---- */
let hiddenAt = 0;
function showOffline(sec) {
  const r = simulateOffline(sec);
  resetSceneSoft();
  if (sec >= 60) { UI.offline = r; renderModal(); $('#modal').classList.add('on'); }
}
function resetSceneSoft() { recalc(); for (let i = 0; i < 4; i++) if (!S.queue[i]) S.queue[i] = genJob(); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); saveGame(); }
  else if (hiddenAt) {
    const el = (Date.now() - hiddenAt) / 1000; hiddenAt = 0; lastTs = performance.now();
    if (el > 8) showOffline(Math.min(el, 8 * 3600));
    audioInit();
  }
});
addEventListener('pagehide', saveGame);
addEventListener('resize', () => { layout(); applyCamMode(); });
addEventListener('orientationchange', () => setTimeout(() => { layout(); applyCamMode(); }, 250));
['gesturestart', 'gesturechange', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('contextmenu', e => e.preventDefault());

/* ---- arranque ---- */
(function boot() {
  const loaded = loadGame();
  let sound = null; try { sound = localStorage.getItem('oficina-tecnica-snd'); } catch (e) { }
  if (loaded) S = loaded;
  if (sound !== null) S.sound = sound === '1';
  recalc(); fillQueue(); rt.shown = S.cash;
  layout();
  const f = focusCam(); camT.x = cam.x = f.x; camT.y = cam.y = f.y; camT.z = cam.z = f.z;
  if (loaded) { const el = (Date.now() - S.seen) / 1000; if (el > 20) showOffline(Math.min(el, 8 * 3600)); }
  rt.eligKey = null; updateElig();
  window.__game = { get S() { return S; }, D, rt, tick, handTap, acceptJob, hire, buyUpg, saveGame, loadGame, openPanel, closePanel, zones, fmt, simulateOffline, UI, cam, claimGoal, goalInfo, openSede, sedePts, claimGift, onCanvasTap, buyOffice, buySala, importCode, exportCode };
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
  }
  goalUpdate(); badgeUpdate(); stripUpdate();
  requestAnimationFrame(t => { lastTs = t; frame(t); });
})();

</script>
